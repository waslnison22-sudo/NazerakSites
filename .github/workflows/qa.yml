name: NaZerak QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nazerak-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run release checks
        run: node scripts/qa-checks.mjs

      - name: Run Supabase runtime smoke test
        run: node scripts/runtime-smoke.mjs
      - name: Wait for GitHub Pages to publish this revision
        run: |
          EXPECTED_AUTH_ASSET=$(grep -o 'auth.js?v=[0-9]*' cabinet.html | head -1)
          EXPECTED_SCRIPT_ASSET=$(grep -o 'script.js?v=[0-9]*' index.html | head -1)
          EXPECTED_STYLE_ASSET=$(grep -o 'styles.css?v=[0-9]*' index.html | head -1)
          for i in {1..18}; do
            if curl -fsSL https://waslnison22-sudo.github.io/NazerakSites/cabinet.html | grep -q "$EXPECTED_AUTH_ASSET" &&
               curl -fsSL https://waslnison22-sudo.github.io/NazerakSites/index.html | grep -q "$EXPECTED_SCRIPT_ASSET" &&
               curl -fsSL https://waslnison22-sudo.github.io/NazerakSites/index.html | grep -q "$EXPECTED_STYLE_ASSET"; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose current auth/script/style assets within 90 seconds."
          exit 1

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Run production browser smoke test
        run: node scripts/browser-smoke.mjs
