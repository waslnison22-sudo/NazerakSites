name: NaZerak QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  NAZERAK_BASE_URL: http://127.0.0.1:4173

concurrency:
  group: nazerak-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run release checks
        run: node scripts/qa-checks.mjs

      - name: Run Supabase runtime smoke test
        run: node scripts/runtime-smoke.mjs
      - name: Start local production server for browser smoke
        run: |
          node scripts/qa-server.mjs > /tmp/nazerak-http.log 2>&1 &
          echo $! > /tmp/nazerak-http.pid
          for i in {1..18}; do
            if curl -fsSL "$NAZERAK_BASE_URL/index.html" | grep -q "NaZerak"; then
              exit 0
            fi
            sleep 1
          done
          echo "Local NaZerak static server did not become ready."
          cat /tmp/nazerak-http.log
          exit 1

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Run production browser smoke test
        run: node scripts/browser-smoke.mjs

      - name: Upload forum visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-hud-visual-qa
          path: artifacts/forum-hud/*.png
          if-no-files-found: warn
          retention-days: 7
