name: NaZerak Production Deploy

on:
  workflow_run:
    workflows: ["NaZerak QA"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nazerak-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: \${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Verify deploy target
        env:
          DEPLOY_HOST: \${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: \${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: \${{ secrets.DEPLOY_PATH }}
          DEPLOY_PRIVATE_KEY: \${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is not configured"; exit 1; }
          test -n "$DEPLOY_PRIVATE_KEY" || { echo "DEPLOY_PRIVATE_KEY is not configured"; exit 1; }

      - name: Deploy public files over SSH
        uses: burnett01/rsync-deployments@v9.0.1
        with:
          switches: -avzr --delete
          path: ./
          remote_path: \${{ secrets.DEPLOY_PATH }}
          remote_host: \${{ secrets.DEPLOY_HOST }}
          remote_port: \${{ secrets.DEPLOY_PORT || '22' }}
          remote_user: \${{ secrets.DEPLOY_USER }}
          remote_key: \${{ secrets.DEPLOY_PRIVATE_KEY }}
          remote_shell: ssh
          args: >
            --exclude=.git/
            --exclude=.github/
            --exclude=.gitignore
            --exclude=supabase/
            --exclude=scripts/
            --exclude=docs/
            --exclude=templates/
            --exclude=public-routes.json
            --exclude=README.md
            --exclude=AUTH_SETUP.md
            --exclude=DOMAIN_MIGRATION.md
            --exclude=.DS_Store

      - name: Verify deployed homepage
        env:
          SITE_URL: https://nazerak.ru
        run: |
          for i in {1..12}; do
            status=$(curl -L -s -o /tmp/nazerak-home.html -w "%{http_code}" "$SITE_URL/")
            if [ "$status" = "200" ] && grep -q "NaZerak" /tmp/nazerak-home.html; then
              echo "Production site is reachable: $SITE_URL/"
              exit 0
            fi
            sleep 5
          done
          echo "Production site did not become healthy."
          exit 1
