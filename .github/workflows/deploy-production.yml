name: NaZerak Production Deploy

on:
  workflow_run:
    workflows: ["NaZerak QA"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: nazerak-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_ENABLED: ${{ secrets.DEPLOY_ENABLED }}

    steps:
      - name: Check production deployment gate
        id: gate
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "Production deploy is disabled. Set DEPLOY_ENABLED=true when DNS, HTTPS and hosting credentials are ready."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify deploy target
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is not configured"; exit 1; }
          test -n "$DEPLOY_PASSWORD" || { echo "DEPLOY_PASSWORD is not configured"; exit 1; }

      - name: Prepare production domain metadata
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/prepare-production.mjs

      - name: Generate public route pages
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/generate-public-routes.mjs

      - name: Prepare web root
        if: steps.gate.outputs.enabled == 'true'
        run: |
          rm -rf .deploy
          mkdir -p .deploy
          tar --exclude='./.git' --exclude='./.github' --exclude='./.gitignore' --exclude='./supabase' --exclude='./scripts' --exclude='./docs' --exclude='./templates' --exclude='./public-routes.json' --exclude='./README.md' --exclude='./AUTH_SETUP.md' --exclude='./DOMAIN_MIGRATION.md' --exclude='./.DS_Store' -cf - . | tar -xf - -C .deploy
          test -f .deploy/index.html

      - name: Deploy public files over SFTP
        if: steps.gate.outputs.enabled == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.DEPLOY_USER }}
          server: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          local_path: './.deploy/*'
          remote_path: ${{ secrets.DEPLOY_PATH }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=10'

      - name: Verify production routes
        if: steps.gate.outputs.enabled == 'true'
        env:
          SITE_URL: https://nazerak.ru
        run: |
          set -e
          for route in / /forum.html /pravitelstvo/ /sud/ /prokuratura/ /fsb/ /voennaya-baza/ /organizatsii/ /o-proekte/; do
            ok=false
            for i in {1..6}; do
              status=$(curl -L -sS -o /tmp/nazerak-check.html -w "%{http_code}" "$SITE_URL$route")
              if [ "$status" = "200" ] && grep -q "NaZerak" /tmp/nazerak-check.html; then
                echo "PASS: $SITE_URL$route"
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != "true" ]; then
              echo "Production route failed: $SITE_URL$route"
              exit 1
            fi
          done
