name: NaZerak Production Deploy

on:
  workflow_run:
    workflows: ["NaZerak QA"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: nazerak-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_ENABLED: ${{ secrets.DEPLOY_ENABLED }}

    steps:
      - name: Check production deployment gate
        id: gate
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "Production deploy is disabled. Set DEPLOY_ENABLED=true when hosting credentials are ready."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify deploy target
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is not configured"; exit 1; }
          test -n "$DEPLOY_PASSWORD" || { echo "DEPLOY_PASSWORD is not configured"; exit 1; }

      - name: Prepare web root
        if: steps.gate.outputs.enabled == 'true'
        run: |
          rm -rf .deploy
          mkdir -p .deploy
          tar --exclude='./.git' --exclude='./.github' --exclude='./.deploy' --exclude='./.gitignore' --exclude='./supabase' --exclude='./scripts' --exclude='./docs' --exclude='./README.md' --exclude='./AUTH_SETUP.md' --exclude='./DOMAIN_MIGRATION.md' --exclude='./.DS_Store' -cf - . | tar -xf - -C .deploy
          test -f .deploy/index.html

      - name: Deploy public files over SFTP
        if: steps.gate.outputs.enabled == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.DEPLOY_USER }}
          server: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          local_path: './.deploy/*'
          remote_path: ${{ secrets.DEPLOY_PATH }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=10'

      - name: Deploy Apache routing file
        if: steps.gate.outputs.enabled == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.DEPLOY_USER }}
          server: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          local_path: './.deploy/.htaccess'
          remote_path: ${{ secrets.DEPLOY_PATH }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=10'

      - name: Remove obsolete public route directories
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- '$DEPLOY_PATH/pravitelstvo' '$DEPLOY_PATH/sud' '$DEPLOY_PATH/prokuratura' '$DEPLOY_PATH/fsb' '$DEPLOY_PATH/voennaya-baza' '$DEPLOY_PATH/organizatsii' '$DEPLOY_PATH/o-proekte'"

      - name: Verify production content
        if: steps.gate.outputs.enabled == 'true'
        env:
          SITE_URL: https://nazerak.ru
        run: |
          set -e
          for route in / /forum /members /search /cabinet; do
            ok=false
            for i in {1..6}; do
              status=$(curl -k -L -sS -o /tmp/nazerak-check.html -w "%{http_code}" "$SITE_URL$route")
              if [ "$status" = "200" ] && grep -q "NaZerak" /tmp/nazerak-check.html; then
                echo "PASS: content $SITE_URL$route"
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != "true" ]; then
              echo "Production content failed: $SITE_URL$route"
              exit 1
            fi
          done

          # Production must not advertise the retired GitHub Pages host.
          if curl -k -L -sS "$SITE_URL/" | grep -Eqi 'waslnison22-sudo\.github\.io|github\.io/NazerakSites'; then
            echo "Production HTML still contains a retired GitHub Pages URL"
            exit 1
          fi

          # Legacy static URLs should canonicalize to clean public routes.
          for pair in "/index.html /" "/forum.html /forum" "/forum-members.html /members" "/forum-search.html /search" "/cabinet.html /cabinet" "/forum-category.html?slug=government /forum/government" "/topic.html?id=1 /forum/topic/1" "/forum-user.html?id=1 /user/1"; do
            set -- $pair
            legacy="$1"
            clean="$2"
            status=$(curl -k -sS -o /dev/null -w "%{http_code}" -I "$SITE_URL$legacy")
            location=$(curl -k -sS -D - -o /dev/null "$SITE_URL$legacy" | awk 'BEGIN{IGNORECASE=1} /^Location:/{print $2}' | tr -d '\r')
            if [ "$status" != "301" ] || [ "$location" != "$SITE_URL$clean" ]; then
              echo "Legacy route did not canonicalize: $SITE_URL$legacy -> $location (HTTP $status)"
              exit 1
            fi
            echo "PASS: legacy $legacy -> $clean"
          done

      - name: Verify production TLS certificate
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          SITE_URL: https://nazerak.ru
        run: |
          if curl -L -sS -o /tmp/nazerak-tls-check.html "$SITE_URL/" && grep -q "NaZerak" /tmp/nazerak-tls-check.html; then
            echo "PASS: trusted TLS certificate for $SITE_URL"
          else
            echo "::warning::HTTPS content is reachable, but the certificate is not trusted by the runner. REG.RU SSL activation/installation still needs attention."
          fi
