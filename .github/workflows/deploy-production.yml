name: NaZerak Production Deploy

on:
  workflow_run:
    workflows: ["NaZerak QA"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: nazerak-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_ENABLED: ${{ secrets.DEPLOY_ENABLED }}
      DEPLOY_PATH: /www/nazerak.ru

    steps:
      - name: Check production deployment gate
        id: gate
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "Production deploy is disabled. Set DEPLOY_ENABLED=true."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify deployment credentials
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_PASSWORD" || { echo "DEPLOY_PASSWORD is not configured"; exit 1; }
          case "$DEPLOY_PATH" in
            /www/nazerak.ru|/www/nazerak.ru/) ;;
            *) echo "DEPLOY_PATH must point to /www/nazerak.ru"; exit 1 ;;
          esac
          echo "Deploy target: $DEPLOY_PATH"

      - name: Prepare web root
        if: steps.gate.outputs.enabled == 'true'
        run: |
          rm -rf .deploy
          mkdir -p .deploy
          tar --exclude='./.git' --exclude='./.github' --exclude='./.deploy' --exclude='./.gitignore' --exclude='./supabase' --exclude='./scripts' --exclude='./docs' --exclude='./README.md' --exclude='./AUTH_SETUP.md' --exclude='./DOMAIN_MIGRATION.md' --exclude='./.DS_Store' -cf - . | tar -xf - -C .deploy
          test -f .deploy/index.html
          printf "%s\n" "${{ github.event.workflow_run.head_sha }}" > .deploy/__nazerak_deploy_sha.txt
          test -f .deploy/forum.html
          grep -q 'forum.css?v=20' .deploy/forum.html

      - name: Deploy public files atomically over SSH
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$DEPLOY_PASSWORD"
          tar -C .deploy -czf - . | sshpass -e ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C \"\$HOME/www/nazerak.ru\""
          echo "PASS: atomic web-root upload completed."

      - name: Remove obsolete public route directories
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- \"$HOME/www/nazerak.ru/pravitelstvo\" \"$HOME/www/nazerak.ru/sud\" \"$HOME/www/nazerak.ru/prokuratura\" \"$HOME/www/nazerak.ru/fsb\" \"$HOME/www/nazerak.ru/voennaya-baza\" \"$HOME/www/nazerak.ru/organizatsii\" \"$HOME/www/nazerak.ru/o-proekte\""

      - name: Verify remote web root
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" '
            test -f "$HOME/www/nazerak.ru/forum.html" &&
            grep -q "forum.css?v=20" "$HOME/www/nazerak.ru/forum.html" &&
            test -f "$HOME/www/nazerak.ru/forum.css" &&
            grep -q "NaZerak Forum v20" "$HOME/www/nazerak.ru/forum.css" &&
            test -f "$HOME/www/nazerak.ru/.htaccess" &&
            grep -q "RewriteRule ^forum/?$ forum.html" "$HOME/www/nazerak.ru/.htaccess" &&
            grep -q "RewriteRule ^forum/topic/([^/]+)/?$ topic.html?id=\\$1" "$HOME/www/nazerak.ru/.htaccess"
          '
          echo "PASS: REG.RU web root contains the rebuilt forum."

      - name: Verify production content
        if: steps.gate.outputs.enabled == 'true'
        env:
          SITE_URL: https://nazerak.ru
        run: |
          set -e
          for route in / /forum; do
            ok=false
            for i in {1..12}; do
              status=$(curl -k -L -sS -o /tmp/nazerak-check.html -w "%{http_code}" "$SITE_URL$route")
              if [ "$status" = "200" ] && grep -q "NaZerak" /tmp/nazerak-check.html; then
                echo "PASS: content $SITE_URL$route"
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != "true" ]; then
              echo "Production content failed: $SITE_URL$route"
              exit 1
            fi
          done

          curl -k -L -sS "$SITE_URL/forum?deploy-check=1" -o /tmp/nazerak-forum.html
          grep -q 'forum.css?v=20' /tmp/nazerak-forum.html
          echo "PASS: production /forum serves the rebuilt forum HTML."

      - name: Verify production TLS certificate
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          SITE_URL: https://nazerak.ru
        run: |
          if curl -L -sS -o /tmp/nazerak-tls-check.html "$SITE_URL/" && grep -q "NaZerak" /tmp/nazerak-tls-check.html; then
            echo "PASS: trusted TLS certificate for $SITE_URL"
          else
            echo "::warning::HTTPS content is reachable, but the certificate is not trusted by the runner."
          fi
